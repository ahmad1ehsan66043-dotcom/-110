<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کنترل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma; }
        body { background: #0f172a; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: #1e293b; padding: 25px; border-radius: 15px; margin-bottom: 25px; text-align: center; }
        h1 { color: #60a5fa; }
        .url-box { background: #0f172a; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #334155; word-break: break-all; }
        .btn { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; margin: 5px; cursor: pointer; }
        .preview-section { background: #1e293b; padding: 25px; border-radius: 10px; margin-bottom: 25px; }
        .image-container { background: #0f172a; padding: 20px; min-height: 400px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        #liveImage { max-width: 100%; max-height: 360px; border-radius: 8px; display: none; }
        .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .image-card { background: #1e293b; border-radius: 8px; overflow: hidden; }
        .image-card img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; }
        .notification { position: fixed; top: 20px; right: 20px; background: #10b981; color: white; padding: 15px 25px; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>
    
    <div class="container">
        <header>
            <h1>🎮 پنل کنترل دوربین</h1>
            <p>📱 دوربین گوشی فعال است</p>
        </header>
        
        <div class="preview-section">
            <h3>🔗 لینک صفحه گوشی:</h3>
            <div class="url-box" id="cameraUrl"></div>
            <div>
                <button class="btn" onclick="copyUrl()">📋 کپی لینک</button>
                <button class="btn" onclick="startSimulation()" style="background:#10b981;">📸 شروع ضبط تست</button>
                <button class="btn" onclick="clearAll()" style="background:#ef4444;">🗑️ پاک کردن</button>
            </div>
        </div>
        
        <div class="preview-section">
            <h3>🖼️ تصویر زنده:</h3>
            <div class="image-container">
                <div id="imagePlaceholder">🔄 منتظر تصویر...</div>
                <img id="liveImage" alt="تصویر زنده">
            </div>
        </div>
        
        <div>
            <h3>📸 تصاویر دریافتی:</h3>
            <div class="images-grid" id="imagesGrid"></div>
        </div>
    </div>
    
    <script>
        const cameraUrl = window.location.origin + '/camera110/camera.html';
        document.getElementById('cameraUrl').textContent = cameraUrl;
        
        let images = [];
        
        function copyUrl() {
            navigator.clipboard.writeText(cameraUrl);
            showNotification('✅ لینک کپی شد');
        }
        
        function startSimulation() {
            setInterval(createTestImage, 3000);
            setTimeout(createTestImage, 500);
            showNotification('🚀 ضبط تست شروع شد');
        }
        
        function createTestImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 640; canvas.height = 480;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, 640, 480);
            
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(20, 20, 600, 440);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('📸 تصویر تست', 320, 220);
            ctx.font = '24px Arial';
            ctx.fillText(new Date().toLocaleTimeString('fa-IR'), 320, 260);
            
            const imageData = canvas.toDataURL('image/jpeg');
            addImage(imageData);
        }
        
        function addImage(imageData) {
            const image = {
                id: Date.now(),
                data: imageData,
                timestamp: new Date().toLocaleString('fa-IR')
            };
            
            images.unshift(image);
            if (images.length > 15) images = images.slice(0, 15);
            
            updateDisplay();
            showLiveImage(image);
        }
        
        function showLiveImage(image) {
            const liveImage = document.getElementById('liveImage');
            const placeholder = document.getElementById('imagePlaceholder');
            
            liveImage.src = image.data;
            liveImage.style.display = 'block';
            placeholder.style.display = 'none';
        }
        
        function updateDisplay() {
            const container = document.getElementById('imagesGrid');
            container.innerHTML = '';
            
            images.forEach(img => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img src="${img.data}" alt="تصویر" onclick="previewImage(${img.id})">
                    <div style="padding:10px; font-size:12px; color:#94a3b8;">${img.timestamp}</div>
                `;
                container.appendChild(card);
            });
        }
        
        function previewImage(imageId) {
            const image = images.find(img => img.id === imageId);
            if (image) showLiveImage(image);
        }
        
        function clearAll() {
            if (confirm('پاک کردن همه تصاویر؟')) {
                images = [];
                updateDisplay();
                document.getElementById('liveImage').style.display = 'none';
                document.getElementById('imagePlaceholder').style.display = 'block';
                showNotification('🗑️ پاک شد');
            }
        }
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(() => { notification.style.display = 'none'; }, 3000);
        }
        
        updateDisplay();
        
        window.previewImage = previewImage;
        window.copyUrl = copyUrl;
        window.startSimulation = startSimulation;
        window.clearAll = clearAll;
    </script>
</body>
</html>
